[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sjsu-parking-monitor"
version = "0.1.0"
description = "A portable CLI that reports live SJSU garage fullness."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rocketride==1.4.0",
    "rich>=14.0,<15.0",
    "winotify==1.1.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "wheel>=0.43",
]

[project.scripts]
parking-monitor = "sjsu_parking_monitor:cli"

[tool.setuptools.packages.find]
include = ["sjsu_parking_monitor"]

[tool.setuptools.package-data]
sjsu_parking_monitor = ["sjsu-parking.pipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
